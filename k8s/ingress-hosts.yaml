# ---------------------------------------------------------------------------
# NEXORA — OPTIONAL host-based Ingress (alternative to path-based routing)
#
#   nexora.local        -> nexora-home-service
#   pay.nexora.local     -> nexora-pay-service
#   movies.nexora.local  -> nexora-movies-service
#   travel.nexora.local  -> nexora-travel-service
#
# This is an ALTERNATIVE to k8s/ingress.yaml — apply only one of the two
# Ingress resources at a time (both are named "nexora-ingress" so applying
# both would simply have the second `kubectl apply` update the first).
#
# Because each host maps 1:1 to a single backend at the domain root, no
# rewrite-target is required here — assets resolve at "/" naturally.
#
# For local testing, add these lines to /etc/hosts (see README.md):
#   127.0.0.1  nexora.local pay.nexora.local movies.nexora.local travel.nexora.local
# (replace 127.0.0.1 with your Ingress Controller's external IP if not
# using a local cluster such as minikube/kind with port-forwarding)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-ingress
  namespace: nexora
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: nexora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-home-service
                port:
                  number: 80
    - host: pay.nexora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-pay-service
                port:
                  number: 80
    - host: movies.nexora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-movies-service
                port:
                  number: 80
    - host: travel.nexora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-travel-service
                port:
                  number: 80
