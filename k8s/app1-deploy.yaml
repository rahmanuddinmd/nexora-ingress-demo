# ---------------------------------------------------------------------------
# NEXORA PAY — Deployment + Service
# Image built from ./app1  ->  rahmanuddinmd17/nexora-pay:v1
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-pay-deployment
  namespace: nexora
  labels:
    app: nexora-pay
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexora-pay
  template:
    metadata:
      labels:
        app: nexora-pay
        app.kubernetes.io/part-of: nexora
    spec:
      containers:
        - name: nexora-pay
          image: rahmanuddinmd17/nexora-pay:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-pay-service
  namespace: nexora
  labels:
    app: nexora-pay
    app.kubernetes.io/part-of: nexora
spec:
  type: ClusterIP
  selector:
    app: nexora-pay
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
